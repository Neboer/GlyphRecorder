name: Verify capture lifecycle fix

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build (no release signing credentials)
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: capture-lifecycle-apks
          path: app/build/outputs/apk/**/*.apk
      - name: Prepare local signing tool
        run: |
          mkdir -p signing-tools
          cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: local-signing-tool
          path: signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/
